<svg width="200" height="300" viewBox="0 0 200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Bottle body -->
  <rect x="40" y="60" width="120" height="220" rx="8" fill="#F5F0EB"/>
  <rect x="40" y="60" width="120" height="220" rx="8" stroke="#E8E0D8" stroke-width="1"/>
  
  <!-- Cap -->
  <rect x="50" y="40" width="100" height="25" rx="4" fill="#1A1A1A"/>
  <rect x="50" y="40" width="100" height="25" rx="4" stroke="#333" stroke-width="1"/>
  
  <!-- Brand name on bottle -->
  <text x="100" y="140" font-family="system-ui, sans-serif" font-size="18" font-weight="600" fill="#1A1A1A" text-anchor="middle">NV</text>
  <text x="100" y="160" font-family="system-ui, sans-serif" font-size="10" font-weight="400" fill="#1A1A1A" text-anchor="middle" letter-spacing="2">SKIN</text>
  
  <!-- Product name -->
  <text x="100" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#1A1A1A" text-anchor="middle">Daily Reset</text>
  
  <!-- Subtle accent line -->
  <rect x="70" y="210" width="60" height="2" rx="1" fill="#D6A080"/>
  
  <!-- Volume text -->
  <text x="100" y="250" font-family="system-ui, sans-serif" font-size="9" fill="#666" text-anchor="middle">100ml</text>
</svg>